<!DOCTYPE html>
<html lang="en">

<head>

    <style>
        body {
            margin: 0;
        }

        a {
            text-decoration: none;
            color: inherit;
        }

        #navbar {
            background-color: beige;
            padding: 0 0.5rem;

            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        @media (max-width: 300px) {
            #navbar {
                flex-direction: column;
            }

            #navbar__logo {
                align-self: start;
                padding-top: 0.2rem;
            }
        }

        #navbar__logo {
            font-size: 1.2rem;
        }

        #navbar__menu {
            display: flex;
            list-style: none;
            padding: 0;
        }

        #navbar__menu li {
            padding: 0.4rem 0.6rem;
        }

        #navbar__menu li:hover {
            background-color: white;
            border-radius: 0.4rem;
        }
    </style>
</head>

<body>
    <nav id="navbar">
        <!-- 브랜드 로고 -->
        <div id="navbar__logo">
            <i class="fa-brands fa-dev"></i>
