<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        div {
            width: 50px;
            margin-left: 200px;
            text-align: right;
            background-color: orange;
            border: 1px solid black;
        }
        span {
            background-color: skyblue;
            border: 1px solid black;
        }
    </style>
</head>

<body>
    <!-- Block-level 요소: 가로 한줄 전체 차지 -->
    <div>A</div>
    <div>B</div>
    <div>C</div> 

    <!-- Inline 요소 -->
    <strong>Lorem</strong> ipsum <span>Inline</span> dolor, <a href="">구글</a>로 이동 sit amet <span>Inline</span> consectetur adipisicing <div>D</div> elit. Expedita aspernatur ducimus, <span>Inline</span> voluptatem omnis alias deleniti consequuntur eveniet. Qui ad rerum doloremque porro non vero, perspiciatis, minima, quasi iusto quas earum!    
</body>

</html>
